R('p-bully','prefect','Something behind the gym',12,pf('head'),"A younger boy came and stood in front of me with his hands in his pockets, studying his shoes. \u201cThere\u2019s a thing,\u201d he said. \u201cBut I\u2019m not allowed to tell.\u201d Three older boys were watching us from the far side of the courtyard, pretending not to.",[
["Say \u201cI won\u2019t make you say it\u201d and stay by him","We walked together to the library. He told me, slowly, in pieces. I told him I\u2019d do something, and that he\u2019d know first. It was the heaviest promise I\u2019d made all year.",{toughness:1,happiness:-1},{st:3,pop:2,pb:2}],
["Go and confront the three","They went quiet. One of them laughed, and I felt my knees go. But I said what I had to say and they knew I meant it. Whether it worked, I wouldn\u2019t know for days.",{toughness:3},{st:2,pop:-2,pb:2}],
["Pass it to a teacher and step back","It was the correct thing, and I knew it. But when the teacher handled it quietly I couldn\u2019t shake the feeling that I\u2019d dropped something that was mine to hold.",{smarts:1},{st:1,pop:0}]]);
R('p-timetable','prefect','The clashing timetable',12,pf('class'),"The new rota had two classes in the same room at the same time, and both teachers had written to me. As class prefect I was the only person who\u2019d noticed. Mr Okafor wanted the room for a test; Miss Lindqvist wanted it for a rehearsal.",[
["Ask both teachers to come and talk","They stood either side of me in the corridor, politely furious. Somehow, by the end of the conversation, we had split the afternoon in two. I\u2019d done a small piece of diplomacy.",{smarts:2},{st:3,pop:1}],
["Quietly move the rehearsal to the hall","Nobody noticed except Miss Lindqvist, who said \u201cwell done\u201d with her eyebrows. It cost me a favour I\u2019d have to repay.",{smarts:1,creativity:1},{st:2,pop:0}],
["Let them sort it out themselves","They didn\u2019t. There was a stand-off, a bell, and a very confused class in the doorway. I got a note about \u201cinitiative\u201d in my file.",{happiness:-1},{st:-2,pop:-1}]]);
R('p-library','prefect','The overdue stack',12,pf('library'),"Someone had returned forty books at once, in a plastic bag, with a note: \u201cSorry.\u201d Sixteen of them were months overdue. One of them was a Latin dictionary I hadn\u2019t known the library owned. The librarian slid the whole pile toward me and went to make tea.",[
["Sort them properly, spine out, by category","It took the whole lunch break. At the bottom of the pile was a letter pressed between pages, forty years old. I put it back where I found it and wrote the date on a card.",{smarts:2,creativity:1},{st:3,pop:0}],
["Ask the culprit in for a chat","He turned out to be a first-year who\u2019d been too scared to return anything. I made him a bookmark and a deal: one book a week. He kept it.",{happiness:2,smarts:1},{st:2,pop:3,pb:1}],
["Stack them and hope nobody asks","They sat in a leaning tower for a week. A teacher pointed it out. I did the sorting then, and with an audience.",{happiness:-1},{st:-1,pop:-1}]]);
R('p-dining','prefect','The food fight that wasn\u2019t',12,pf('dining'),"Something was going to happen at the long table. I could tell by the way four boys had stopped talking at once, and by the single pea sitting on a fork like a loaded catapult. As dining prefect, I was standing three metres away with a jug of water.",[
["Walk over and stand directly behind them","The pea was lowered, slowly. Someone coughed. I stayed there until the soup arrived and the moment passed. Nobody said a word. I had won without saying anything, which is the best kind.",{toughness:1,smarts:1},{st:2,pop:0}],
["Join in, and throw the pea back","The hall erupted for ten seconds, which was exactly the amount of time a teacher needed to enter. I was the only one standing. It was a very long walk to the staff room.",{mischief:4,happiness:3},{st:-3,pop:6,pb:-1}],
["Challenge them to a better game","\u201cWhoever finishes their carrots first picks the pudding rota.\u201d It was ridiculous. They did it with grim determination. The rota was, afterwards, a joke that lasted a term.",{creativity:2,happiness:2},{st:2,pop:3}]]);
R('p-sports','prefect','The cancelled fixture',12,pf('sports'),"The other school had cancelled our match with one hour\u2019s notice. The team was changed and waiting in the cold, pads strapped on, bags dumped. As sports prefect, the job of telling them fell to me. The captain was already walking over.",[
["Tell them straight and suggest a scrimmage","There was a groan, a few curses, and then a nod. We split into two sides and played harder than any official match. Nobody kept the score, and everybody knew who won.",{toughness:2,happiness:3},{st:3,pop:4}],
["Say it\u2019s a mix-up and ring them back","I spent forty minutes on the office phone while the team froze. They had double-booked the pitch. We got the match at half-term and I got a reputation for being a pain.",{smarts:2},{st:2,pop:-1}],
["Ask the coach to break the news","He did, kindly, with a speech about resilience. They listened. They hated it. I stood at the back and felt very small and very relieved.",{happiness:-1},{st:0,pop:-2}]]);
R2('p-headtalk','prefect','The assembly speech',13,pf('head'),"The headmaster asked me to give the Monday address. Four minutes. \u201cAnything you like,\u201d he said, which is the most terrifying thing an adult can say. I had a stack of cards, a trembling knee and a school of five hundred waiting.",[
["Talk about something small and true","I told them about a boy who held a door for me when no one was looking. It wasn\u2019t a big story. When I sat down, the hall was quiet in a way that felt like respect.",[["Look up and smile","A teacher caught my eye and nodded. It was one of those moments that doesn\u2019t get a name.",{happiness:3,creativity:2},{st:4,pop:4,pb:2}],["Stare at my shoes and sit down fast","I didn\u2019t see the nod, but others did. Later three people told me it was \u201cactually good\u201d.",{happiness:2},{st:3,pop:2}]]],
["Talk about the school rules, as advised","I read the list, and the hall endured it. When I finished, a boy at the back clapped once, sarcastically, then stopped when nobody joined.",[["Laugh along with the room","The laugh broke the tension and the headmaster hid a smile. It was survivable.",{happiness:1},{st:1,pop:1}],["Glare at the back row","I took it badly, which everyone saw. It was a mistake I\u2019d relive in bed.",{toughness:1,happiness:-2},{st:-1,pop:-3}]]]]);
/* CLUBS */
const K=(n,aw,note,tag)=>{const o={cs:n,tag:tag||'club'};if(aw)o.award=aw;if(note)o.note=note;return o};
const cm=(club,minAge)=>({club,minAge});
/* Newspaper */
R2('c-news-leak','club','The anonymous tip',11,{club:'Newspaper Club'},"An envelope slid under the club room door with no name on it. Inside: a photocopied page from the staff minutes saying the sports budget had been cut in half to pay for a new office carpet. The editor read it twice, then looked at the room. \u201cWe could print it,\u201d she said. \u201cIf it\u2019s true.\u201d",[
["Verify it first","I spent two days asking quiet questions. A secretary confirmed it with a wince. Now we had a real story and a real problem.",[["Run it, with the facts","It ran on page one. The principal called it \u201cunhelpful\u201d, and the sports teams called it brave. A week later the budget was partly restored.",{smarts:3,happiness:3},K(6,"Story of the term \xB7 school paper",null,"club")],["Take it to the principal first","She asked for a day, then gave us a fair quote and her version. A less thrilling piece, but a better one. We learned the difference.",{smarts:2},K(4,null,"The paper held a story back for a day to hear the principal\u2019s side.")]]],
["Print it straight away","The ink was still wet when the first copies went round. By lunchtime half the staff room was angry and the other half was pretending not to be.",[["Defend it to the staff","I stood in a corridor while Mr Hale asked where we\u2019d got it. I said sources. He said sources had to be right. They were, luckily.",{toughness:2,smarts:1},K(5,"Fearless reporter",null,"club")],["Claim it was a draft that got out","They believed it, mostly. The editor said later that I\u2019d protected the club and damaged my own word. She was right.",{mischief:2,happiness:-1},K(1,null,"A student told teachers a leaked story was only a draft.","embarrassing")]]]]);
R('c-news-interview','club','The visiting author',9,{club:'Newspaper Club'},"We got fifteen minutes with a children\u2019s author who\u2019d come to open the new library wing. I had ten questions on a card. She was tired, her train was delayed, and she\u2019d been asked \u201cwhere do you get your ideas?\u201d four times already today.",[
["Ask the questions on the card in order","She answered politely, in the voice of someone who\u2019s been through it before. The piece was fine. Nobody remembered it.",{smarts:1},K(2)],
["Throw the card away and ask what scares her","She stopped, laughed, and put down her tea. \u201cThat\u2019s the first interesting one,\u201d she said, and told me about a fear of lifts. The interview ran long. The piece was the best in the issue.",{creativity:3,smarts:2,happiness:2},K(6,"Best interview \xB7 school paper",null,"club")],
["Ask her to sign the paper instead","She signed it, and drew a small cat. It was lovely, but it wasn\u2019t a story, and the editor said so very kindly.",{happiness:1},K(2)]]);
R('c-news-typo','club','The headline',9,{club:'Newspaper Club'},"We were an hour from the printers when someone noticed the front-page headline. It said that the principal was \u201cretiring after thirty years of surface\u201d. Service. It was meant to say service. The editor had gone the colour of the newsprint.",[
["Fix it by hand with a marker on every copy","Two hundred copies, four of us, ink to the wrists. By the time we were done the bell had gone twice. The principal read it, saw the marker, and laughed until she cried.",{creativity:2,happiness:3},K(4,null,"The paper corrected a headline typo by hand on every copy.")],
["Re-run the page and miss the deadline","The paper came out a day late and flawless. The editor was grim. Half the school had already heard about the typo anyway.",{smarts:2},K(3)],
["Leave it and hope no one notices","Everyone noticed. A teacher framed it. It hung in the staff room for the rest of the year, and the club has never lived it down.",{mischief:2,happiness:-2},K(1,null,"The school paper printed a headline about the principal\u2019s \u201csurface\u201d.","embarrassing")]]);
/* Art */
R('c-art-mural','club','The corridor mural',8,{club:'Art Club'},"The deputy head had given the Art Club a whole wall to paint, with one rule: \u201cnothing frightening\u201d. We were nine kids standing in front of nine metres of beige. Someone had already drawn a very small dragon in the corner with a pencil.",[
["Push for a big, bold idea","I sketched a whale rising out of a school building. It scared half the club and thrilled the other half. In the end, the whale won.",{creativity:4,happiness:3},K(6,"Mural lead \xB7 art club",null,"club")],
["Compromise on a plan everyone likes","We ended with a tidy garden of flowers and bees. It was fine, even pretty, and nobody was upset. It lacked a dragon.",{creativity:1,happiness:2},K(3)],
["Add the dragon back in, secretly","In the corner of the flower garden, a small green dragon was reading a book. It took the teachers a month to notice, and by then the school loved it.",{mischief:3,creativity:3},K(5,null,"A tiny dragon appeared in the Art Club\u2019s corridor mural.")]]);
R('c-art-critique','club','The harsh critique',10,{club:'Art Club'},"Mr Vance went down the row of easels with his hands behind his back. At mine, he stopped and said nothing for a long time. \u201cIt\u2019s competent,\u201d he said, finally, in the voice of a man describing a ham sandwich.",[
["Ask him what would make it better","He sighed, took a brush, and did not touch the painting. Instead he told me where the light would really fall. The next version was better, and I knew why.",{creativity:3,smarts:2},K(4)],
["Argue that he doesn\u2019t get it","\u201cPerhaps,\u201d he said, and walked on. I stood in the silence knowing I\u2019d won nothing at all.",{mischief:1,happiness:-2},K(1)],
["Take it quietly and paint over it","By next week it was a different picture entirely. It was the best thing I\u2019d done. Mr Vance said nothing, and pinned it to the board.",{creativity:4,happiness:2},K(5,"Pinned by Mr Vance \xB7 art club",null,"club")]]);
/* Basketball */
R2('c-bball-final','club','Down by one',11,{club:'Basketball Team'},"Four seconds on the clock and we were down by one. Coach drew a play on the whiteboard that was mostly arrows, and then crossed it all out. \u201cJust get it to whoever\u2019s open,\u201d she said, which is an instruction that has won and lost more games than any tactics.",[
["Take the shot myself","The ball left my hands and everything slowed. It hit the rim, danced, and thought about it.",[["Watch it fall","It dropped. The gym erupted, and someone I didn\u2019t know hugged me hard enough to bruise.",{toughness:2,happiness:5},K(6,"Buzzer beater \xB7 league game",null,"achievement")],["Close my eyes","It bounced out. The buzzer sounded. A teammate gripped my shoulder and said \u201cgood shot\u201d, and for once, I think they meant it.",{toughness:1,happiness:-1},K(2,null,"The basketball team lost by one point at the buzzer.")]]],
["Pass to the open player","The pass was clean, and the shot was too. For a half-second I thought we\u2019d won, but the ref blew his whistle. Offside.",[["Argue the call","Coach put her hand on my arm. \u201cLet it go,\u201d she said. We lost, and I learned to carry it.",{toughness:2,happiness:-1},K(2)],["Shake hands with the other team","I walked down the line saying \u201cwell played\u201d. One of them said it back, honestly. It was a small, odd comfort.",{smarts:1,happiness:1},K(4)]]]]);
R('c-bball-bench','club','Benched',10,{club:'Basketball Team'},"Coach read the starting five and my name wasn\u2019t in it. I sat on the bench with my towel over my knees and watched the tip-off. At the second quarter, a boy beside me whispered, \u201cIt\u2019s not personal.\u201d It felt personal.",[
["Cheer harder than anyone","I shouted so much that I lost my voice. Coach noticed, and at the start of the third, she said my name. I wasn\u2019t ready, and I was.",{toughness:2,happiness:3},K(5)],
["Sulk and stare at the floor","The game went on without me, and so did my mood. At the end Coach said, kindly, \u201cYou\u2019re better than your face.\u201d",{happiness:-2},K(1,null,"A benched player sulked through a whole basketball game.","embarrassing")],
["Ask Coach after the game what to work on","She gave me three things on a napkin. I practised them for a month and was starting by December.",{smarts:2,toughness:2},K(4)]]);
/* Debate */
R2('c-debate-side','club','The wrong side',10,{club:'Debate Society'},"The motion was \u201cThis house believes homework should be abolished\u201d. We\u2019d been randomly assigned to Proposition, which would have been fine if I hadn\u2019t been up all night arguing the opposite at the kitchen table. The other team had a boy who spoke like a news anchor.",[
["Argue it with conviction anyway","I built my case on the flimsiest of facts and delivered it like I\u2019d been born to. The judges looked suspiciously impressed.",[["Take the rebuttal with a smile","The anchor boy tried to dismantle me. I simply asked him to define \u201cwork\u201d. The room laughed, and he lost his place.",{smarts:3,happiness:3},K(6,"Best speaker \xB7 inter-house",null,"achievement")],["Stick rigidly to my notes","The notes carried me through. I wasn\u2019t brilliant, but I wasn\u2019t beaten either.",{smarts:2},K(4)]]],
["Admit to the judges I disagree","It was either very brave or very stupid. A pause. The judge raised a single eyebrow.",[["Pivot and argue it as a thought experiment","\u201cLet\u2019s suppose I\u2019m wrong,\u201d I said, and the audience leaned in. It was theatre, and it worked.",{creativity:3,smarts:2},K(5,"Judges\u2019 favourite \xB7 inter-house",null,"club")],["Apologise and sit down","The judge said, \u201cHonesty is not a defence strategy.\u201d We lost. It was a lesson in what honesty is for.",{happiness:-1,smarts:1},K(1)]]]]);
R('c-debate-heckle','club','The heckler',12,{club:'Debate Society'},"Halfway through my speech, a boy in the third row began to cough, very pointedly, every time I made a point. The judges noticed. I noticed. The other team noticed and pretended they hadn\u2019t.",[
["Stop and politely wait","I stood in silence, hands folded, until the coughing died out. The room had gone very quiet. Then I resumed. It was my best minute.",{smarts:2,toughness:2},K(5,null,"A debater waited out a heckler in complete silence.","club")],
["Make a joke about it","\u201cThere\u2019s a doctor in the house?\u201d The audience howled, and the heckler turned scarlet. I lost my thread, though.",{mischief:2,happiness:2},K(3)],
["Ignore it and speed up","I raced through the end with my voice cracking. It was a speech, technically.",{happiness:-1},K(1)]]);
/* Drama */
R2('c-drama-auditions','club','The casting list',8,{club:'Drama Troupe'},"The list went up on the noticeboard at lunchtime and by the time I got there, a crowd had formed. Some people were screaming, some were stony-faced, and one girl was crying in the stairwell. I pushed forward on tiptoe. My name was in the third column, down by the \u201cvillagers\u201d.",[
["Accept it graciously","I smiled, said congratulations to the lead, and went to find my script. The director saw me do it.",[["Make the best villager anyone has seen","I invented a limp, a tragic backstory and a cough. By dress rehearsal, the director gave me a line.",{creativity:4,happiness:3},K(5,"Scene-stealer \xB7 school play",null,"club")],["Learn everyone\u2019s lines","I became the unofficial prompter. When the lead lost her place in the show, I whispered it. Nobody ever knew.",{smarts:2,happiness:2},K(4)]]],
["Go to the director and ask why","She was gentle and honest. \u201cYou\u2019re good,\u201d she said, \u201cbut you don\u2019t listen.\u201d That stung because it was true.",[["Ask her to teach me how","We met on Fridays. By spring I\u2019d learned to hold a pause. The next production, I got the part.",{smarts:2,creativity:2},K(5)],["Say it\u2019s unfair and leave","I sat on the bleachers feeling hot-faced. In a week it felt silly, and I went back.",{happiness:-2},K(1)]]]]);
R('c-drama-stage','club','The collapsing set',9,{club:'Drama Troupe'},"On the second night, a painted wall of the castle began to lean. It wobbled, then leaned further, and the whole cast froze in the middle of a very serious scene. In the wings, someone whispered \u201cholding it\u201d. Someone was.",[
["Improvise a line about \u201cearthquakes\u201d","\u201cThe kingdom trembles!\u201d I declared, and the audience, thinking it was part of the show, gasped. The stagehand got the wall upright, and the scene carried on.",{creativity:4,happiness:4},K(6,"Quick thinker \xB7 school play",null,"achievement")],
["Hold the wall myself","I was the extra holding it up for the rest of the scene. In the final bow, the director pointed at me, and the audience cheered, confused and delighted.",{toughness:2,happiness:3},K(5)],
["Freeze and wait for rescue","Somebody on the end broke into giggles, and then everyone did. We finished the scene crying with laughter. It was disastrous and everyone loved it.",{happiness:2},K(2,null,"A set wall collapsed during the school play and the cast laughed through it.","embarrassing")]]);
/* Choir */
R2('c-choir-solo','club','The high note',8,{club:'School Choir'},"The last verse had a note so high I\u2019d been avoiding it for three weeks. Mrs Adeyemi stopped the rehearsal, walked to the front, and said, \u201cAgain. From the verse. And I want to hear all of you.\u201d That meant me. I could feel my face getting hot.",[
["Take a breath and go for it","The first try cracked. The second wobbled. On the third, it hung in the air, thin and true, and the rest of the choir stopped to listen.",[["Hold it until she cuts me off","It rang in the hall. Mrs Adeyemi lowered her hand slowly. \u201cThere,\u201d she said, softly, as though she\u2019d found something she\u2019d lost.",{creativity:4,happiness:5},K(6,"Soloist \xB7 spring concert",null,"achievement")],["Let it fade early","I got most of it, and the choir covered the end. It was fine, and I was relieved.",{happiness:1},K(3)]]],
["Mouth the note and let others carry it","Nobody could tell, I thought. After the rehearsal, Mrs Adeyemi stood next to me and didn\u2019t say a word.",[["Admit it and ask for help","She gave me a breathing exercise with a ridiculous name. I practised it in the shower, and in the third week, I sang the note.",{smarts:1,creativity:2},K(4)],["Pretend nothing happened","The silence was uncomfortable. I\u2019d be remembered as the kid who mouthed the high note, at least by me.",{happiness:-2},K(1)]]]]);
R('c-choir-wrong','club','Singing the wrong verse',8,{club:'School Choir'},"In front of the parents, the choir began the second verse with enormous confidence. It was the third verse. Nobody noticed except me and the boy next to me, and we looked at each other with a growing horror.",[
["Sing the third verse louder to match","Some of the others began to follow. A minute later the whole choir had slid onto the right verse, as if nothing had happened. A parent clapped.",{smarts:2,happiness:2},K(4,null,"The choir quietly corrected a wrong verse in front of the parents.")],
["Whisper to the conductor","She didn\u2019t turn her head, but her hand signalled a small cut. We reset, the piano caught up, and the audience, bless them, thought it was a key change.",{smarts:2},K(3)],
["Keep singing the wrong verse","I sang my heart out and incorrectly. Afterwards a parent told me it was the most heartfelt singing of the night. I decided not to correct her.",{mischief:1,happiness:1},K(2,null,"A chorister sang the wrong verse with total commitment.","embarrassing")]]);
/* Science */
R2('c-sci-bridge','club','The spaghetti bridge',9,{club:'Science Olympiad'},"The challenge: a bridge built from a box of spaghetti and a hot glue gun, to hold as much weight as possible. We had an hour. My partner wanted to build a triangle truss. I wanted to try a weird curved thing I\u2019d seen in a book.",[
["Build the truss","It was elegant and sensible. We tested it with a small bag of coins, and it carried them with a whisper of a creak.",[["Keep adding weight until it breaks","At two kilos the whole thing sighed and slumped. We\u2019d come second. Our partner looked pleased and I looked at the debris with new respect.",{smarts:3,happiness:2},K(5,"Silver \xB7 bridge challenge",null,"club")],["Stop while we\u2019re ahead","We came fourth. A safe, respectable fourth. I wondered what would have happened had we pushed.",{smarts:1},K(3)]]],
["Build the curve","It took everything. The glue burnt my finger, and the curve sagged, and halfway through it looked dreadful. And then, suddenly, it held.",[["Present it with confidence","The judge crouched to examine it, and prodded it, and said \u201cHuh\u201d. We won on creativity, though not on weight.",{creativity:4,smarts:2},K(5,"Most creative design \xB7 Science Olympiad",null,"achievement")],["Apologise for its wobbliness","The judge said, \u201cNever apologise for your design. Explain it.\u201d I carried that sentence for years.",{smarts:2},K(3)]]]]);
R('c-sci-lemon','club','The honest result',10,{club:'Science Olympiad'},"Our experiment had a result that didn\u2019t fit. The hypothesis said X, and the data very clearly said Y. The judges were due in ten minutes. My partner looked at the page, then at me, and said, in a low voice, \u201cWe could just\u2026 round it.\u201d",[
["Report the real result","We presented the strange data honestly. The judge squinted at the graph and asked three sharp questions. We didn\u2019t have all the answers. We said so.",{smarts:3,happiness:2},K(5,"Honest scientist \xB7 Science Olympiad",null,"achievement")],
["Round the numbers","The numbers looked beautiful. They also looked a bit too beautiful, and the judge noticed. We didn\u2019t win, and I felt sick for a week.",{mischief:2,happiness:-3},K(0,null,"A pair of students were caught tidying up their experimental data.","embarrassing")],
["Propose a new test on the spot","\u201cCan we re-run it?\u201d I asked. They gave us ten more minutes. It confirmed the strange result and was infinitely more interesting.",{smarts:4,creativity:2},K(6,"Best follow-up \xB7 Science Olympiad",null,"club")]]);
/* Track */
R2('c-track-relay','club','The final leg',10,{club:'Track Team'},"I was the anchor, which meant I\u2019d be handed the baton at the point when everything depended on me. The other school\u2019s runner was already ahead. My teammate, thirty metres out, was coming in fast, breathing like a bellows.",[
["Start running early","I started too soon, and for a horrible half-second the baton was out of reach.",[["Slow and reach back","It slapped into my palm, and I was off. We\u2019d lost a fraction of a second but kept the baton.",{toughness:3,happiness:2},K(4)],["Keep sprinting and hope","We never made the exchange cleanly. The baton clattered onto the track, and a collective groan rose from the stands.",{toughness:1,happiness:-3},K(1,null,"The track relay team dropped the baton at the final exchange.","embarrassing")]]],
["Wait calmly for the handover","The baton came into my hand like it was meant to be there. I ran, and the track fell away under me.",[["Lean into the final stretch","I caught one runner, then another. At the line I was a whole body-length behind first and absurdly happy about it.",{toughness:4,happiness:4},K(6,"Anchor leg \xB7 regional relay",null,"achievement")],["Ease off when I think it\u2019s over","I lost a place at the very end. Coach told me later that races last till the tape.",{toughness:1},K(3)]]]]);
R('c-track-morning','club','The 6 a.m. run',9,{club:'Track Team'},"It was five degrees and raining sideways. Coach stood under an umbrella the size of a shed roof and said, \u201cLaps. Twelve. Go.\u201d Half the team groaned. The other half were already disappearing into the mist.",[
["Run it flat out from the start","I was first through the first four laps and last through the final four. Coach didn\u2019t say anything. She handed me a towel, and a look.",{toughness:2,happiness:-1},K(2)],
["Run with the slowest kid and pace them","We came in last, together, and very proud. Coach said it was \u201cthe best-run twelve laps of the morning\u201d.",{happiness:3,smarts:1},K(4)],
["Fake a cramp and walk it","Coach watched, quite calmly, as I limped for three laps and then speed-walked the fourth. She said nothing. She doesn\u2019t have to.",{mischief:2},K(0,null,"A runner faked a cramp at morning training.","embarrassing")]]);
/* SCHOOL EVENTS */
const SC=(pop,note,tag)=>{const o={pop};if(note)o.note=note;if(tag)o.tag=tag;return o};
R('s-fire','school','The fire drill',6,{},"The alarm went off in the middle of a maths test. Thirty pencils dropped at once. Mr Oyelaran said, \u201cWalk, do not run\u201d, which was so clearly a challenge that half the class ran. Outside, everyone stood on the field in a damp, giggling mass, and someone had brought a ham sandwich.",[

["Use the break to chat to someone new","A girl from another class and I talked about the test, and her cat, and the worrying quality of school sandwiches. We were on first-name terms by the end of the bell.",{happiness:3},SC(3,"A fire drill led to a new friendship.","achievement")],
["Hide the ham sandwich","I found out later it belonged to the headteacher. I returned it quietly. We never spoke of it.",{mischief:2,happiness:1},SC(0,"A student hid the headteacher\u2019s sandwich during a fire drill.","embarrassing")]]);
R('s-sports','school','Sports day heats',6,{},"The egg-and-spoon race was ruthless. A small boy in the next lane was running with the grim speed of someone who\u2019d been training for months. I had a stripey egg and a spoon that had been bent by someone\u2019s teeth.",[
["Run it flat out","I crossed the line, egg intact, and was halfway through my victory lap before I realised the egg had been a boiled one from the start.",{toughness:2,happiness:2},SC(3)],
["Slow down and let the little boy win","He crossed the line with his arms in the air. I got a nod from the teacher, who had seen the whole thing, and a look from the boy that I will remember.",{happiness:3},SC(2,"A student let a younger runner win the egg-and-spoon.","achievement")],
["Drop the egg on purpose and laugh","It cracked, all over my shoe. The whole field lost it. I was disqualified and applauded in equal measure.",{mischief:3,happiness:3},SC(4,"The egg-and-spoon race ended in a yolk-covered disaster.","embarrassing")]]);
R('s-trip','school','The museum trip',7,{},"The coach smelled of orange peel and crisps. Our class had been given a worksheet at the museum and told to find ten facts. A skeleton of something huge hung above us, and a boy behind me whispered that it moved at night.",[

["Wander off to the gift shop","I got lost, found, scolded, and left with a rubber dinosaur. It was a good use of an afternoon.",{mischief:2,happiness:2},SC(1)],
["Tell the whole class the skeleton moves at night","By the end of the day half the year was convinced. I got a long talk from our teacher and a quiet nod of respect from the guide.",{creativity:2,mischief:3},SC(3,"A student convinced the class that the museum skeleton moved at night.","achievement")]]);
R2('s-exam','school','Exam morning',9,{},"The hall had been rearranged into rows of identical desks and a clock the size of a dinner plate. The invigilator read the instructions in the voice of a man reading a will. I opened the paper and the first question was one I\u2019d never seen before in my life.",[

R('s-assembly','school','The assembly prank',10,{},"Somebody had swapped the school song\u2019s sheet music for the Pink Panther theme. The pianist, a serious girl in the sixth form, sat down with great dignity and played the first bar. The entire hall froze. Then, from the back, someone started to hum.",[

R('s-election','school','The class vote',8,{},"Mrs Pike wrote two names on the whiteboard for class monitor. One was mine; the other was a girl I\u2019d never beaten at anything. We were allowed one minute each to say why. I looked at the room and felt the weight of thirty faces.",[

R('s-bake','school','The bake sale',7,{},"The PTA had set up a long table in the hall, covered with a lace cloth, and every cake had been made by a parent hoping to impress other parents. My tray of biscuits had come out slightly burnt and distinctly rectangular.",[

["Swap them for a nicer tray","The substitute tray was somebody\u2019s lemon drizzle. I left mine in a bin and carried the guilt all day.",{mischief:2,happiness:-1},SC(0)],

R('s-snow','school','The snow day',6,{},"The head announced it over the tannoy at half past nine: school was closing at noon because of the snow. A cheer rose from every classroom. Outside, the field was white and untouched, and the whole year was looking at it like a dare.",[
["Build the biggest snowman on the field","It took twenty of us and a borrowed scarf. By the time the buses came it was taller than the caretaker, and he saluted it.",{creativity:3,happiness:4},SC(4,"A class built the tallest snowman the school had seen.","achievement")],
["Start a snowball fight","It began as a skirmish and ended with a siege. A teacher got caught in the crossfire and, to everyone\u2019s astonishment, joined in.",{toughness:2,mischief:2,happiness:4},SC(5)],

R('f-cook','family','Cooking together',5,{},"{parent} had decided that tonight we were making dumplings from scratch. The kitchen looked like a crime scene: flour on the ceiling, a bowl of something unidentified, and a recipe card that had been splattered into illegibility. \u201cIt\u2019ll be fine,\u201d {parent} said, in the tone of someone who knew it would not.",[

R('f-sick','family','Home with a fever',4,{},"I woke up too hot and too heavy, with a throat full of glass. {parent} laid a cold hand on my forehead, and made a face. I was told to stay in bed, and given soup that tasted of the inside of a saucepan, which I ate anyway.",[

["Pretend I\u2019m worse than I am","I added a cough, and a dramatic sigh. {parent} saw straight through me and brought a second bowl of soup, out of spite, or love.",{mischief:2},{bond:1}],

R('f-argue','family','A sharp word',9,{},"It started over something small, a dish left by the sink, and escalated until {parent} and I were both speaking in the clipped voices of two people who both knew they were wrong. The kitchen clock ticked. I could feel my face burning.",[

R('f-recital','family','The empty seat',8,{},"I looked down from the stage at the audience, and the seat I\u2019d saved for {parent} was empty. The lights were too bright to see anything else. The curtain opened and the first piano note rang out and I had to start before I could think.",[

["Play badly out of spite","I stumbled through the piece. Everyone clapped politely. I felt small and mean, and it did nothing to the empty seat.",{happiness:-3},{bond:-3}],

R('f-night','family','The night drive',10,{},"We\u2019d been driving for hours, and the road was dark and wet. The radio was low. {parent} drummed their fingers on the wheel, and, in the half-light, looked much younger than I\u2019d noticed before. \u201cCan I tell you something?\u201d they said.",[
["Yes, of course","They told me about a time they\u2019d been scared, and wrong, and young. It wasn\u2019t advice. It was just a story, and I held onto it like a coin.",{smarts:2,happiness:3},{bond:6}],

R('dt-picnic','date','The rainy picnic',13,{},"We\u2019d planned a picnic by the river, and then it rained. {name} turned up anyway, in a coat that was clearly three sizes too big, carrying a basket and a plastic sheet. \u201cIt\u2019s fine,\u201d they said, though a drip was running off the end of their nose.",[

R('dt-arcade','date','High score',13,{},"The arcade smelled of carpet and popcorn, and {name} had already claimed the machine in the corner. \u201cI\u2019ll beat you,\u201d they said, rolling their sleeves up. Their record on it, I knew, was a number carved on the board in the school hall.",[

R('dt-letter','date','The folded note',14,{},"A note was passed to me in the corridor, folded into a small, tight square. It was in {name}\u2019s handwriting, which I\u2019d have known anywhere. I opened it in the stairwell with trembling hands. It said: \u201cMeet me by the old oak at four. Bring nothing.\u201d",[

["The old friend in the supermarket",21,70,"By the frozen peas, a familiar face turned. It was someone you\u2019d been close to, long ago, before life rearranged you both. They said your name with a surprised smile. Their trolley was nearly full.",[["Suggest coffee and mean it",'kind',{happiness:3,smarts:1}],["Chat for a minute and part",'safe',{happiness:1}],["Duck into the next aisle",'sly',{mischief:2,happiness:-2}]]],
["Overtime offer",23,55,"Your manager leaned on your desk and said, \u201cThere\u2019s a deadline Friday. It would really help.\u201d She was smiling, and the unspoken part of the sentence hung there. It was already your fourth late night this month.",[["Say yes, and take the extra pay",'bold',{money:80,health:-2,happiness:-1}],["Say no politely",'safe',{happiness:2,smarts:1}],["Negotiate time in lieu",'sly',{smarts:3,happiness:1}]]],
["A promotion rumour",24,55,"The office was buzzing with a rumour that someone on your team would be promoted. Your name had been mentioned, though not by you. Your colleague, a friend, was looking more anxious than usual.",[["Ask my manager directly",'bold',{smarts:2,toughness:1}],["Keep my head down and work",'safe',{smarts:2}],["Quietly reassure my colleague",'kind',{happiness:2,smarts:1}]]],
["The leaking ceiling",24,70,"A brown stain had appeared on the ceiling, and it was spreading. The flat above was empty, according to the neighbour. You stood on a chair, holding a torch, wondering how a person is supposed to know what to do.",[["Call the landlord at once",'safe',{smarts:2}],["Climb up and look myself",'bold',{toughness:2,health:-1,mischief:1}],["Bang on every door in the building",'kind',{happiness:1,smarts:2}]]],
["Weekend away",21,50,"A group of friends had planned a weekend by the sea, and you\u2019d said yes in a moment of enthusiasm. Now it was nearly time. The forecast said rain, the trains were disrupted, and your bank balance was low.",[["Go, and make the best of it",'bold',{happiness:4,money:-60}],["Cancel, and stay home",'safe',{money:20,happiness:-2}],["Suggest a day trip instead",'kind',{smarts:2,happiness:2,money:-20}]]],
["The anonymous complaint",26,60,"A colleague mentioned, lightly, that someone had complained about your work. They didn\u2019t know who. You thought of everyone you\u2019d worked with and wondered who it could have been, and whether they had a point.",[["Ask my manager for details",'bold',{smarts:3,toughness:1}],["Reflect and improve quietly",'safe',{smarts:3}],["Quietly find out who did it",'sly',{mischief:3,happiness:-2}]]],
["A lonely Sunday",20,85,"The day stretched out in front of you, grey and unplanned. The phone was silent, and the fridge was a bleak sight. Out of the window, the neighbourhood moved on with its Sunday lunches and its dogs.",[["Call someone I haven\u2019t spoken to",'kind',{happiness:3}],["Go for a long walk",'safe',{health:2,happiness:1}],["Cook something ambitious",'bold',{creativity:3,happiness:2,money:-15}]]],
["The neighbour\u2019s party",21,55,"At eleven, the bass came through the wall. At midnight, it came through the floor. At one, you were standing in the corridor in a dressing gown, holding a mug, wondering if you were a person who knocked or a person who didn\u2019t.",[["Knock and ask nicely",'safe',{smarts:2,happiness:1}],["Knock and join the party",'bold',{happiness:4,mischief:2,health:-1}],["Bang on the wall in return",'sly',{mischief:3,happiness:-1}]]],
["A forgotten dream",28,65,"Clearing out a drawer, you found an old notebook full of plans: a business, a book, a trip. Your younger handwriting was bold and unembarrassed. You sat on the floor and read it for an hour.",[["Start one of them again",'bold',{creativity:4,happiness:3,money:-30}],["Put it back with fondness",'safe',{happiness:1}],["Show it to a friend",'kind',{happiness:3,smarts:1}]]],
["The reunion invite",30,60,"A message popped up: a school reunion, twenty years on. Names you\u2019d forgotten, faces you\u2019d half-forgotten. You wondered who\u2019d be fat, who\u2019d be rich, who\u2019d be dead, and what they\u2019d think of you.",[["Go, in your best clothes",'bold',{happiness:3,money:-40}],["Go in as you are",'kind',{happiness:3}],["Ignore it",'safe',{happiness:-1}]]],
["A health scare",35,80,"The doctor looked at the screen for a little too long. \u201cIt\u2019s probably nothing,\u201d she said, in the voice of someone who wanted to say more. She handed you a card with the name of a clinic and a telephone number.",[["Book the follow-up that day",'safe',{health:2,smarts:2,money:-20}],["Ask a friend to come with me",'kind',{happiness:2,health:1}],["Put it off for a month",'sly',{health:-3,happiness:-1}]]],
["The visiting nephew",30,75,"Your sister\u2019s boy had come to stay for the weekend. He was nine, and had questions. Why did you live alone? Why didn\u2019t you have a dog? What was the strangest thing you\u2019d ever eaten? He listened to the answers with grave attention.",[["Tell him the honest answers",'kind',{happiness:3,smarts:1}],["Teach him a card trick",'bold',{creativity:2,happiness:3}],["Take him to the park",'safe',{happiness:2,health:1,money:-10}]]],
["A lucky find",20,80,"At a car boot sale, you found a framed print for two pounds. The seller shrugged. Something about it was familiar, and a quick search on your phone suggested it might be worth rather more.",[["Buy it and have it valued",'sly',{smarts:2,money:150}],["Tell the seller what I think",'kind',{happiness:3,smarts:1}],["Buy it just because I like it",'safe',{happiness:2,money:-2}]]],
["Your parent\u2019s birthday",25,75,"It was your mother\u2019s birthday, and she\u2019d said she wanted nothing. Which meant, as you both knew, a great deal. She was at the other end of the train line, and the last train was in an hour.",[["Get on the train with a cake",'kind',{happiness:4,money:-25}],["Phone and chat for an hour",'safe',{happiness:2}],["Send flowers",'safe',{happiness:1,money:-30}]]],
["A bad review",25,60,"Someone had posted an unkind review of the thing you\u2019d worked on for months. It was two lines long, clever and cruel. You read it nine times, and by the tenth, you were composing a reply.",[["Post a polite, public response",'bold',{smarts:2,toughness:1}],["Delete my draft and walk away",'safe',{smarts:2,happiness:1}],["Send them a very cutting message",'sly',{mischief:3,happiness:-2}]]],
["The stray dog",22,70,"A thin, shaggy dog had followed you home and now sat on the doorstep, looking at you with the expression of a creditor. It had no collar. It was raining. You looked at the dog. The dog looked at you.",[["Take it in and call the vet",'kind',{happiness:4,money:-40}],["Feed it and put up posters",'safe',{happiness:2,money:-10}],["Shoo it on, with regret",'sly',{happiness:-2}]]],
["The group chat",21,45,"The friends\u2019 group chat had been quiet for months, and then, at midnight, it lit up. Someone was getting engaged, someone else was moving abroad, and a third had posted a photo of you, from years ago, without asking.",[["Reply with a good photo of them",'sly',{mischief:2,happiness:2}],["Say congratulations to everyone",'kind',{happiness:3}],["Mute the chat",'safe',{happiness:-1}]]],
["A day off, finally",23,60,"You\u2019d been working for twenty-three days straight, and finally, on a bright Tuesday, you had a day to yourself. The laundry was piled up, and the fridge was empty. Out the window, the sky was an absurd blue.",[["Do all the chores",'safe',{smarts:1,happiness:-1}],["Take a train somewhere random",'bold',{happiness:4,money:-30}],["Spend it in bed with a book",'kind',{happiness:3,health:1}]]],
["Retirement party",55,75,"The office had gone to some trouble: a cake, a card, a speech from someone who barely knew you. At the back, a colleague you\u2019d worked beside for thirty years was wiping their eyes. You\u2019d been given a clock.",[["Say a few honest words",'kind',{happiness:3,smarts:1}],["Raise a glass and keep it short",'safe',{happiness:2}],["Tell the funniest story I know",'bold',{happiness:4,creativity:1}]]],
["The old photographs",50,90,"A box of photographs came to light in the loft: faces, holidays, a dog you\u2019d forgotten. Each one was a small, silent door. You sat on the stairs, with the box on your knees, and the afternoon went by.",[["Call someone in the photos",'kind',{happiness:3}],["Frame the best ones",'safe',{creativity:2,happiness:2,money:-15}],["Put them back, carefully",'safe',{happiness:1}]]],
["A grandchild\u2019s question",55,95,"A small voice asked, \u201cWhat was it like when you were little?\u201d The room went quiet. You looked at the small, earnest face, and, behind it, saw the long road that had led here.",[["Tell the true story",'kind',{happiness:4,smarts:1}],["Tell a tall tale",'sly',{creativity:3,mischief:1,happiness:3}],["Show them an old photograph",'safe',{happiness:3}]]],
["The garden",45,90,"The garden had gone wild while you weren\u2019t looking. The roses had won, the lawn had lost, and the shed had developed a small, determined tree. You stood on the step with a cup of tea and pondered, with a certain relish, the work.",[["Spend the weekend on it",'bold',{health:2,happiness:3,money:-25}],["Hire someone",'safe',{money:-60,happiness:1}],["Let it be wild, on purpose",'sly',{creativity:3,happiness:2}]]]

In \u201CThe tired dog slowly crossed the road\u201D: dog and road are nouns, crossed is a verb, tired is an adjective, and slowly is an adverb.`},{title:"Sentences and punctuation",body:`A sentence needs a subject (who or what) and a verb. \u201CBirds sing\u201D is a complete sentence; \u201CBecause it rained\u201D is not.

Use commas to separate items in a list: apples, mangoes and bananas. An apostrophe shows possession (the girl\u2019s bag) or a missing letter in a contraction (don\u2019t = do not).

Its means belonging to it. It\u2019s means it is.`},{title:"Reading and figurative language",body:`The main idea is what a text is mostly about. To infer, combine clues in the text with what you know: if a character shivers and pulls on a coat, you can infer it is cold.

A fact can be checked. An opinion says what someone thinks: \u201CMaths is the best subject.\u201D

A simile compares using like or as (as brave as a lion). A metaphor says one thing is another (the classroom was a zoo).`}],bank:[ct("g7-l1","In \u201CThe tired dog crossed the road\u201D, which word is a verb?","crossed",["tired","dog","road"],"Crossed is the action. Tired describes, and dog and road name things.",1),ct("g7-l3","In \u201Cthe red kite\u201D, which word is an adjective?","red",["the","kite","None of them"],"Red describes the noun kite.",0),ct("g7-l4","Which sentence is written correctly?","It\u2019s raining today.",["Its raining today.","Its\u2019 raining today.","Is raining today."],"It\u2019s is short for \u201Cit is\u201D, so the apostrophe is needed.",3),ct("g7-l5","Which of these is a complete sentence?","Birds sing.",["Running down the hill.","Because it rained.","The big red."],"It has a subject (birds) and a verb (sing).",2),ct("g7-l8","\u201CAs brave as a lion\u201D is an example of a\u2026","simile",["metaphor","fact","opinion"],"It compares using the word \u201Cas\u201D, which makes it a simile.",0),ct("g7-l9","Which sentence is an opinion?","Maths is the best subject.",["A week has seven days.","The Sun is a star.","Ice is frozen water."],"People can disagree about \u201Cbest\u201D. The others can be checked.",3),ct("g7-l2","In \u201CShe spoke quietly\u201D, which word is an adverb?","quietly",["She","spoke","No word in the sentence"],"Quietly describes how she spoke, so it is an adverb.",2),ct("g7-l6","Which sentence punctuates the list correctly?","I bought apples, mangoes and bananas.",["I bought apples mangoes and, bananas.","I bought, apples mangoes and bananas.","I bought apples mangoes, and, bananas."],"Commas separate the items, with \u201Cand\u201D before the last one.",1),ct("g7-l7","In \u201Cthe girl\u2019s bag\u201D, what does the apostrophe show?","Possession: the bag belongs to the girl",["A plural: more than one girl","A missing letter","A question"],"An apostrophe with s shows who owns something.",3),ct("g7-l10","\u201CShe shivered and pulled on her coat.\u201D What can you infer?","It was cold.",["She was angry.","She was hungry.","It was midday."],"Shivering and putting on a coat are clues that it was cold.",0)]},l6={id:"sci",name:"Science",slides:[{title:"Cells: the building blocks of life",body:`All living things are made of cells. Animal and plant cells both have a nucleus (controls the cell), cytoplasm (where reactions happen), a cell membrane (controls what enters and leaves) and mitochondria (release energy).

Plant cells also have a cell wall (support), chloroplasts (make food using light, called photosynthesis) and a large vacuole. Animal cells do not have cell walls or chloroplasts.`},{title:"States of matter",body:`Matter exists as a solid, a liquid or a gas. In a solid the particles are packed tightly and vibrate in place, so it keeps its shape. In a liquid they are close but slide past each other, so it flows. In a gas they are far apart and move quickly, so it fills any container.

Heating a solid until it melts makes a liquid; heating a liquid until it boils makes a gas. Water melts at 0\xB0C and boils at 100\xB0C at sea level.`},{title:"Forces and energy",body:`A force is a push or a pull, measured in newtons (N). Gravity pulls objects towards the Earth. Friction is a force that resists movement between surfaces that rub together.

cal energy becomes light and some heat.",0)]},d6={id:"soc",name:"Social Studies",slides:[{title:"Reading maps",body:`A map is a drawing of an area seen from above. The compass rose shows north, south, east and west. A map key (legend) explains the symbols. A scale shows how map distance relates to real distance: if 1 cm = 10 km, then 3 cm = 30 km.

The Earth has seven continents and five oceans. The equator is an imaginary line round the middle of the Earth, dividing north from south.`},{title:"Communities, rules and government",body:`A community is a group of people who live or work together. Communities make rules to keep people safe and settle disagreements fairly.

In a democracy, citizens choose their leaders by voting.`},{title:"How we learn about the past",body:`Historians study the past using sources. Primary sources come from the time being studied, such as letters, photographs and diaries. Secondary sources are written later, such as textbooks.

role:"Friend",bond:65},familyBond:2,education:"Kindergarten"},{label:"Keep my carefully packed lunch",outcome:"I ate what my family packed and saved a story about my day to tell them at home.",effects:{health:2,smarts:2},familyBond:1,education:"Kindergarten"}]},{age:3,title:"A kingdom in the sandbox",text:"A castle towers above the sandbox. Its builders invite you over. Your foot is almost exactly the size of the front gate.",choices:[{label:"Help build a magnificent moat",outcome:"We built a moat together. Our sand kingdom had three towers, four rulers, and excellent teamwork.",effects:{creativity:4,happiness:3,smarts:2}},{label:"Stomp the castle like a tiny monster",outcome:"I stomped the castle. The builders were not impressed. I said sorry and helped rebuild one lopsided tower.",effects:{mischief:5,happiness:-2,smarts:1}}]},{age:4,title:"Just one more bedtime story",text:"Your blanket is warm. The lamp is low. Your parent says it is bedtime, but surely the teddy bear deserves another story?",choices:[{label:"Ask for one more story and a cuddle",outcome:"We read one more story, curled up together. I fell asleep before the dragon finished its speech.",effects:{happiness:4,smarts:2},familyBond:3},{label:"Invent a story about a moon-sized biscuit",outcome:"I told a story about a biscuit that ate the moon. My parent laughed so hard that bedtime became a little later.",effects:{creativity:5,happiness:3},familyBond:2},{label:"Sneak out for a midnight adventure",outcome:"My midnight adventure reached the hallway. I was carried back to bed like a very small, very sleepy outlaw.",effects:{mischief:4,health:-1},familyBond:-1}]},{age:4,title:"But why does the moon follow us?",text:"On the walk home, the moon seems to follow you. You have questions. Hundreds of them. Your parent has one shopping bag and limited answers.",choices:[{label:"Ask why until we figure it out",outcome:"I asked why the moon followed us. We looked it up together at home. The world got bigger, and a little less mysterious.",effects:{smarts:5,happiness:2},familyBond:2},{label:"Decide the moon is my secret pet",outcome:"I named the moon Biscuit and told it to sit. It was extremely well behaved, if a little distant.",effects:{creativity:5,happiness:3}},{label:"Ask whether the moon needs the toilet",outcome:"I asked whether the moon needed the toilet. My parent laughed all the way home. I still want an answer.",effects:{mischief:3,creativity:2,happiness:3},familyBond:1}]},{age:5,title:"Little feet, big sports day",text:"Kindergarten sports day! The finish line feels miles away. Your teacher waves a ribbon, and your family is cheering louder than everyone else.",choices:[{label:"Run the little sprint",outcome:"I lined up for my first sports-day sprint, with determined little feet and one slightly crooked sock.",effects:{happiness:2},athletic:"sprint"},{label:"Cheer for my classmates",outcome:"I cheered until my voice went squeaky. My teacher said being a good teammate matters, too.",effects:{happiness:4},familyBond:1}]}],U6=[{age:0,title:"The 3 a.m. concert",text:"It is the middle of the night. Everyone is asleep. Your lungs feel extraordinarily powerful.",choices:[{label:"Perform a full-volume solo",outcome:"I sang the song of my people at 3 a.m. Dada walked laps of the hallway until sunrise.",effects:{mischief:4,health:1},familyBond:-1},{label:"Suck my thumb and drift off",outcome:"I found my thumb, the greatest invention of all time, and slept like a tiny king.",effects:{happiness:3,health:2},familyBond:2}]},{age:0,title:"Peekaboo philosophy",text:"Mama hides behind her hands. Is she gone forever? Is she still there? This is the deepest question you have ever faced.",choices:[{label:"Giggle uncontrollably",outcome:"Every reappearance was the funniest thing in history. We played for forty minutes.",effects:{happiness:5},familyBond:3},{label:"Grab her hands and investigate",outcome:"I pulled her hands away to check the mechanism. Science demands answers.",effects:{smarts:4,creativity:1}}]},{age:1,title:"The great toy squabble",text:"Your cousin is holding YOUR rattle. Technically it was never yours. Emotionally, it always was.",choices:[{label:"Snatch it back",outcome:"I reclaimed the rattle with lightning hands. My cousin wailed. I was told about sharing, at length.",effects:{mischief:5,toughness:2},familyBond:-1},{label:"Offer my teddy in exchange",outcome:"I offered teddy as a trade. Diplomacy works. Everyone was impressed.",effects:{smarts:3,happiness:2},familyBond:3},{label:"Cry until it returns",outcome:"I cried with such sincerity that the rattle came home within seconds.",effects:{mischief:2,happiness:1}}]},{age:1,title:"Bathtime splash zone",text:"Warm water, rubber duck, and a parent kneeling dangerously close to the edge of the tub.",choices:[{label:"Splash with both hands",outcome:"I turned bathtime into a wave pool. Papa needed a towel more than I did.",effects:{happiness:4,mischief:3}},{label:"Hold the duck like a treasure",outcome:"I held my duck carefully and babbled our secret plans to it.",effects:{creativity:3,happiness:2},familyBond:1}]},{age:2,title:"Supermarket meltdown",text:'A bright packet of sweets at exactly your eye level. Your parent says "not today". The floor looks comfortable.',choices:[{label:"Throw a legendary tantrum",outcome:"I lay on the supermarket floor and wailed. Strangers stared. No sweets. Long silent ride home.",effects:{mischief:6,happiness:-2},familyBond:-3},{label:"Ask very nicely",outcome:'I said "pwease" with my biggest eyes. One small sweet appeared. Manners are magic.',effects:{happiness:3,smarts:2},familyBond:2},{label:"Hide it in the trolley",outcome:"I sneaked the sweets into the trolley. The cashier found them. Everyone laughed except my parent.",effects:{mischief:4,creativity:2}}]},{age:2,title:"The forbidden cupboard",text:"The kitchen cupboard that clicks. Pots, pans, and a mysterious drawer of lids. You have finally reached the handle.",choices:[{label:"Drum on every po ,outcome:"Teddy got a stylish trim. Teddy did not complain.",effects:{creativity:3,happiness:2}}]},{age:5,title:"A lost tooth fortune",text:"Your first wobbly tooth finally pops out at dinner. The Tooth Fairy is rumored to pay well.",choices:[{label:"Put it under my pillow",outcome:"I tucked it under my pillow and woke up to a shiny coin. Tooth economics are amazing.",effects:{happiness:4},money:2},{label:"Try to stay awake to catch the fairy",outcome:"I stayed up waiting with a torch. I fell asleep at 8:04 p.m. The fairy still came.",effects:{mischief:2,creativity:3},money:2}]},{age:5,title:"Show and tell",text:"Tomorrow is show and tell. You can bring anything. Anything at all.",choices:[{label:"Bring my favorite book",outcome:"I read a page aloud to my class. My teacher gave me a gold star.",effects:{smarts:4,happiness:2}},{label:"Bring a jar of garden worms",outcome:"I brought worms. Half the class screamed, half wanted to hold them. Legendary.",effects:{mischief:3,creativity:3,toughness:2}},{label:"Bring Dada",outcome:"I brought my father. He did a magic trick and became the most popular person in kindergarten.",effects:{happiness:4},familyBond:4}]}],rk=[...ak,...U6].sort((t,e)=>{var a,r;return((a=t.age)!=null?a:0)-((r=e.age)!=null?r:0)});function q6(t=Math.random){let e=[];for(let a=0;a<=5;a++){let r=rk.filter(l=>l.age===a),o=a===5?r.filter(l=>l.choices.some(d=>d.athletic)):[],n=r.filter(l=>!o.includes(l)).map(l=>({e:l,r:t()})).sort((l,d)=>l.r-d.r).map(l=>l.e),i=1+Math.floor(t()*2);e.push(...[...o,...n].slice(0,Math.max(i,o.length+(a===5?1:0))).map(l=>l.title))}return e}function ok(t){var i,l;let e=typeof window!="undefined"?(i=window.__immGen)==null?void 0:i.call(window,t):null;if(e)return e;let r=(t.childhoodPlan?rk.filter(d=>{var h;return(h=t.childhoodPlan)==null?void 0:h.includes(d.title)}):ak).find(d=>{var h,c;return(((h=d.age)!=null?h:0)>t.age||((c=d.age)!=null?c:0)===t.age&&t.age>0&&t.journal.some(u=>u.kind==="choice"&&u.age===t.age))&&!t.journal.some(u
