irst group ran it wrong. The second group ran it wrong in a different way. By the time I went I knew where the cones were and which one a boy called Tobi always cut. I ran it clean and felt briefly like a genius.",[s("Show off a bit with the ball","show"),s("Play it simple","simple")]),back:j("I hid. It worked for about ten minutes. Then the coach said, \u201CYou. Back row. Why are you standing there like furniture?\u201D and the entire gym turned round.",[s("Step up and drive for the basket","push"),s("Apologise and leave","quit")]),push:N("I made the team as the last name on the list, in pen, with an arrow next to it that I don\u2019t think meant anything. \u201CTraining\u2019s at six,\u201D the coach said. \u201CDon\u2019t be late.\u201D I was early, at five-forty, in a gym with no heating, and I felt like I belonged.",0,{toughness:3,happiness:5},{cs:5,note:"A new player made the basketball squad after a gruelling tryout.",tag:"sports"}),pace:N("I made the squad, not the first five, but the squad. The coach said I had good feet. Nobody had ever said that about me before, or since.",0,{toughness:2,happiness:4},{cs:4}),show:N("I tried a spin and dropped the ball. It bounced across the court and under the coach\u2019s shoe. She picked it up, looked at me, and said, \u201CBasics.\u201D I made the team anyway, which I choose to believe says something.",0,{toughness:2,happiness:3,mischief:1},{cs:3,note:"A basketball tryout hopeful dropped the ball under the coach\u2019s shoe, and still made the team.",tag:"embarrassing"}),simple:N("I played it simple. Nobody noticed, which in a tryout is the best compliment. I made the team, in a position called \u201Cbench\u201D, which the coach insisted was tactical.",0,{toughness:2,happiness:3},{cs:3}),quit:N("I went home. Someone asked how it went and I said, \u201CFine.\u201D It wasn\u2019t, but it wasn\u2019t a disaster either. I stared at my school bag for most of the evening. There\u2019s always next year, and next year\u2019s tryout is on a Wednesday.",0,{happiness:-2},{cs:0})}},{id:"fourthquarter",kind:"club",club:"Basketball Team",title:"Fourth quarter",minAge:9,beats:{start:j("We were down by two with forty seconds left against a school that wore matching socks and had a mascot. The coach drew something on a whiteboard that looked like a map of a bad idea. Femi was shaking, Tobi was clapping, and I was on court only because someone had twisted an ankle.",[s("Call for the ball","call"),s("Set a screen for Tobi","screen"),s("Defend their best player","defend")]),call:j("The pass came harder than I expected. I caught it with my chest, which is not the recommended place. The gym went quiet in the way that means everyone has already imagined what happens next.",[s("Shoot","shoot"),s("Pass it to Tobi","pass"),s("Drive hard to the basket","drive")]),screen:j("I planted myself. The defender hit me like a coat falling off a hook. Tobi slipped past and I heard the crowd inhale. I had done something right and had no idea what it was.",[s("Follow up and take the rebound","shoot"),s("Look for Tobi","pass")]),defend:j("Their best player was called Kwame and he was patient. For twenty seconds I mirrored him, and he looked at me with real annoyance, which I decided was respect. The ball went out of bounds off his hand.",[s("Grab the loose ball","shoot"),s("Throw it to the point guard","pass")]),shoot:N("It rimmed the hoop once, twice, and fell in with half a second left. I didn\u2019t celebrate, because I didn\u2019t believe it. Then Femi tackled me, the bench emptied, and the coach threw her whistle in the air. We won by one. I couldn\u2019t feel my face for an hour.",0,{toughness:4,happiness:6},{cs:7,award:"Game-winner \xB7 Basketball Team",note:"A last-second shot won the basketball match for the school.",tag:"sports"}),pass:N("Tobi scored with two seconds left and everyone hugged him. I got a pat on the back from the coach and a bag of oranges. Nobody wrote my name down, and I found out I didn\u2019t mind.",0,{toughness:2,happiness:5},{cs:4,note:"The basketball team won a tight match on a last-second pass.",tag:"sports"}),drive:N("I drove for the basket and met a defender and the floor, in that order. My ankle made a sound I\u2019ve never made myself. I sat out the rest of the game with ice on it, watching us lose by three. The coach said, \u201CThat was brave.\u201D I said, \u201CThat was stupid.\u201D She said, \u201CSometimes the same.\u201D",0,{health:-5,happiness:-2,toughness:2},{cs:2,note:"A student limped off during the basketball match with an ankle injury.",tag:"sports"})}},{id:"mural",kind:"club",club:"Art Club",title:"The mural",minAge:7,beats:{start:j("The art teacher had decided, without asking anyone, that the wall outside the library needed a mural. We had a week, eleven tins of paint, and one rule: nothing offensive. A boy called Sunil asked if a dragon counted. The teacher said it depended on the dragon.",[s("Draw the sketch","sketch"),s("Mix the colours","mix"),s("Suggest something nobody has suggested","idea")]),sketch:j("I drew the school\u2019s long wall in perspective, with the library as a ship. It looked good until I realised the ship had nowhere to go. A girl called Mia looked at it and said, \u201CIt needs a sea,\u201D and then, \u201CNot literally.\u201D",[s("Make a sea out of everyone\u2019s handprints","prints"),s("Leave it and let the others decide","others")]),mix:j("I mixed what I thought was sky blue and it came out the colour of a hospital corridor. Someone said, \u201CThat\u2019s a lot of grey,\u201D and I said, \u201CIt\u2019s moody.\u201D The teacher, passing, said, \u201CMoody is fine. Dead is not.\u201D",[s("Fix it with yellow","prints"),s("Declare it a style","others")]),idea:j("I suggested the mural show the school as students actually live it: the corridor traffic jam, the radiator everyone sits on, the one broken water fountain. The teacher put down her brush and thought for a long time. \u201CIt\u2019s that or the dragon,\u201D she said.",[s("Argue for the real school","prints"),s("Compromise, and add a small dragon","others")]),prints:N("We painted a sea out of handprints, forty students, every colour. By Thursday it had a boat, a dragon, and a note from the headmaster saying he approved, in the tone of a man who hadn\u2019t been consulted. A parent stopped to photograph it and cried quietly in the car park. The mural is still on the wall.",0,{creativity:5,happiness:6},{cs:7,award:"Mural artist \xB7 Art Club",note:"Art Club painted a handprint mural on the library wall.",tag:"club"}),others:N("It got finished, mostly. The dragon is small and slightly annoyed. Nobody put their name on it. In a few years someone will wonder who painted it, and nobody will remember, and I think that\u2019s fine.",0,{creativity:3,happiness:3},{cs:4,note:"Art Club painted a mural outside the library.",tag:"club"})}},{id:"deadline",kind:"club",club:"Newspaper Club",title:"The deadline",minAge:10,beats:{start:j("The school newspaper went to print on Friday. It was Wednesday, and we had two stories, a crossword nobody had solved, and a photograph of the bins. The editor, a Year 11 with an eraser behind each ear, said, \u201CRight. What do we have?\u201D and looked at me, because I was the only one who hadn\u2019t looked away.",[s("Pitch the broken water fountain","fountain"),s("Pitch an interview with the kitchen staff","dinner"),s("Pitch what everyone says about the head","head")]),fountain:j("A story about a broken water fountain. Everyone agreed it was the single greatest injustice at the school. I went to find the caretaker, who had been fixing it, in theory, since January. He had a lot to say.",[s("Print exactly what he said","print"),s("Soften it","soften")]),dinner:j("The woman who ran the kitchen had done it for nineteen years and had opinions about every child in the school. She talked for forty minutes about a mystery cheese nobody had eaten since September. I wrote it all down in a notebook I\u2019d owned for two days.",[s("Run it as a funny feature","print"),s("Make it a serious piece on the menu","soften")]),head:j("The head\u2019s secretary said he was in a meeting. I waited outside for forty-five minutes. When he came out and saw my notebook he said, \u201CAh. Journalism,\u201D like a man who had been waiting for it his whole career.",[s("Ask the real question","print"),s("Ask about the car park instead","soften")]),print:N("We ran it as it was. The editor called it \u201Cthe first honest thing we\u2019ve printed.\u201D By Friday lunch the whole school had read it, three teachers had commented, and the caretaker had stuck the page on the fountain. It was fixed on Monday.",0,{smarts:3,creativity:3,happiness:5},{cs:7,award:"Story of the term \xB7 Newspaper Club",note:"A school paper story about the broken fountain got it fixed.",tag:"club"}),soften:N("We ran a gentler version. Nobody complained, nobody noticed, and by Monday the fountain was still broken. The editor said, \u201CNext time, push.\u201D I wrote it on my hand.",0,{smarts:2,creativity:2,happiness:2},{cs:3,note:"The school paper covered the broken fountain.",tag:"club"})}}],Hn=(t,e,a,r,o,n,i,l)=>({id:t,kind:"dorm",title:e,minAge:10,when:d=>!!d.dorm,beats:{start:j(a[0],[s(a[1],"a"),s(a[2],"b")]),a:j(r[0],[s(r[1],"t1"),s(r[2],"t2")]),b:j(o[0],[s(o[1],"t1"),s(o[2],"t2")]),t1:j(n[0],[s(n[1],"e1"),s(n[2],"e2")]),t2:j(i[0],[s(i[1],"e2"),s(i[2],"e3")]),e1:N(l[0][0],0,l[0][1],l[0][2]),e2:N(l[1][0],0,l[1][1],l[1][2]),e3:N(l[2][0],0,l[2][1],l[2][2])}});ol.push(Hn("laundry","Laundry day",["Laundry day was Thursday, which meant a queue for the one working washing machine on our floor. {a} was ahead of me with a bag the size of a toddler. I had a week of socks and a plan.","Wait in the queue","Wash it by hand in the sink"],["The queue moved at the speed of a government office. Someone at the front was folding dry clothes inside the machine, which is a crime nobody prosecutes.","Ask them to hurry up","Say nothing and wait"],["The sink was designed for teeth. I filled it with soap, socks and optimism, and water ran down my sleeves, across the floor and under {b}\u2019s bed.","Mop it up with a spare shirt","Pretend it never happened"],["Then {b} walked in, took in the state of things and the look on my face, and held very still, deciding whether to be angry or curious.","Own up and apologise","Make a joke of it"],["An hour passed. Somebody\u2019s radio played the same song three times. {c} wandered past, sniffed, and asked, \u201CIs that you?\u201D I didn\u2019t know which smell they meant.","Laugh and ask for help","Pretend not to hear"],[["{b} laughed so hard they had to sit on my wet bed. We hung everything on the corridor radiator together, and by evening the whole floor smelled of someone else\u2019s fabric softener. It was, in a strange way, the best Thursday.",{happiness:3},{cl:3,rm:4}],["{c} took one end of the sheet and I took the other. We wrung it out like a rope. They never mentioned the smell again, which is the highest form of respect a hostel can offer.",{happiness:2},{cl:2,rm:2}],["I stayed silent and pretended. For a week everyone walked the long way round my bed, and the sock on the radiator became known as \u201Cthe evidence\u201D.",{happiness:-2},{cl:-2,rm:-3,note:"A hostel laundry flood became a week-long joke at one student\u2019s expense.",tag:"embarrassing"}]]),Hn("bins","The bin rota",["It was our room\u2019s week for the bins. Nobody had said so, but the smell had. The bag by the door had reached the point of having opinions.","Take it out right now","Draw up a rota on the whiteboard"],["The bin area was behind the kitchen, past a door that only opened if you leaned on it in exactly the right way. Something in the dark moved. It was a cat. Probably.","Keep going","Come back when it\u2019s quiet"],["I drew a rota: four names, four days. {a} added a fifth column called \u201Cexcuses\u201D. {b} wrote their name against the day with the fewest letters. It was already a war.","Enforce it firmly","Let it slide this once"],["A warden stood in the corridor holding a clipboard and an expression of tired authority. \u201CWhose rubbish is this?\u201D she said, pointing at the bag in my hand. It was, technically, all of ours.","Take the blame","Name the room, not the person"],["Nobody saw. Nobody said anything. Which is exactly how I knew it would come back on us.","Do it properly this time","Leave it until tomorrow"],[["She nodded, wrote something down, and said, \u201CAt least someone owns it.\u201D Back in the room {a} and {b} had cleaned the floor out of guilt. Nobody mentioned it again. That was the whole ceremony.",{happiness:2},{cl:4,rm:3}],["We took it out together, all four of us, in a slow procession like we were burying something. On the way back {c} said, \u201CNever again,\u201D and we all knew we\u2019d be back on Tuesday.",{happiness:2},{cl:3,rm:2}],["The bag got worse. By Thursday the warden had visited twice, and our door had a note on it in red pen: PLEASE. That was all. Just PLEASE.",{happiness:-2},{cl:-4,rm:-2,pop:-2,note:"One dorm room got a red-pen note on its door that said only \u201CPLEASE\u201D.",tag:"embarrassing"}]]),Hn("inspection","Inspection morning",["The inspector was coming at nine. At seven the room looked like a crime scene: four beds, three open suitcases, one mystery sock on the ceiling fan.","Take charge and hand out jobs","Hide everything in the wardrobe"],["I gave out jobs. {a} got the floor, {b} the windows, {c} the \u201Cgeneral vibe\u201D. Nobody had asked for a vibe job, but it was the one they took most seriously.","Check everyone\u2019s work","Trust them and tidy my corner"],["The wardrobe held, for about four minutes. Then the door began to bulge outward and {c} sat against it, whispering, \u201CIt\u2019s fine, it\u2019s fine, it\u2019s fine.\u201D","Take it all out and do it properly","Add another layer of stuff"],["It looked better than it had in a month. At ten to nine the corridor went quiet, and a voice said, \u201CRoom four.\u201D That was us.","Stand to attention","Act casual"],["It looked like the wardrobe was trying to leave. At ten to nine the corridor went quiet, and a voice said, \u201CRoom four.\u201D That was us.","Confess everything","Stand in front of the wardrobe"],[["The inspector walked slowly round, ran a finger along the window ledge and found nothing. \u201CGood,\u201D she said, which in that building is a medal. {a} nearly fainted with relief.",{happiness:4},{cl:8,rm:3,pop:2,note:"A dorm room was named the cleanest of the term after an inspection.",tag:"achievement"}],["We got a pass and one comment: \u201CAdequate.\u201D {b} framed the word on a piece of paper and stuck it above their bed.",{happiness:2},{cl:4,rm:2}],["The wardrobe opened on its own. A tide of socks, a pillow and half a sandwich came out together. The inspector looked at it for a long time. \u201CInteresting,\u201D she said, and wrote one word.",{happiness:-2},{cl:-3,rm:-2,pop:-2,note:"A dorm room failed inspection when its wardrobe burst open in front of the inspector.",tag:"embarrassing"}]]),Hn("kitchen","Kitchen duty",["It was my turn on kitchen duty. In practice that meant standing beside a pot the size of a paddling pool, stirring, while the cook, who could silence a hall with one eyebrow, told me what I was doing wrong.","Stir the way she tells me","Add my own touch"],["I stirred left, right, clockwise, with feeling. \u201CNot like you\u2019re angry at it,\u201D she said. \u201CLike you\u2019re asking it a question.\u201D It was the best cooking advice I\u2019ve ever had, and I still don\u2019t understand it.","Taste it","Ask her to taste it"],["I added pepper. A lot of pepper. A sneeze began near the back of the room and rolled forward in waves, until even the cook sneezed once, furiously.","Own up straight away","Blame the wind"],["It tasted like food, just not like the food from home. It had the flavour that says: made for two hundred people by someone who has done this every day for twenty years.","Say something kind to the cook","Ask for the recipe"],["She tasted it, said nothing, and then added one pinch of something from a tin with no label. She looked at me over the spoon like I\u2019d seen something I shouldn\u2019t.","Just nod","Ask what\u2019s in the tin"],[["She nodded once. At lunch the next day she put an extra piece of fish on my plate without comment. Nobody else got extra. {a} noticed. Everybody noticed.",{happiness:4},{rm:2,pop:3}],["We finished the pot. She said, \u201CSame time next week,\u201D which I decided to read as permission.",{happiness:2},{rm:1}],["The tin was salt. It was a very ordinary tin of salt. She looked at me for a long, disappointed time, and I washed pots until the lights went out.",{happiness:-2},{pop:-1,note:"A student on kitchen duty got a lecture about a tin of salt.",tag:"funny"}]]),Hn("bathroom","The second shower",["The bathroom on our floor had four showers, two working, and a rota nobody had written down but everyone obeyed. Mine was Monday morning: scrub the tiles before the seven o\u2019clock rush.","Scrub properly with the good brush","Do a quick wipe and run"],["There was a layer of something by the drain that had clearly been there since the last government. I scrubbed. I scrubbed again. {a} wandered in and said, \u201CYou know you don\u2019t have to be this loud about it.\u201D","Tell them to help","Keep going alone"],["It looked cleaner. It mostly was. Then the first student of the morning slipped on what I\u2019d taken for shine and arrived in the corridor holding a towel like a flag.","Apologise and fetch a mop","Look busy and walk away"],["Together we found out why the second shower had never worked: a plug of hair and soap the size of a small animal. {c} held it up. We named it. It deserved a name.","Dispose of it with ceremony","Report it to the warden"],["By seven the corridor was queuing and the tiles gleamed in a way that made my back hurt. Nobody said thank you, which is how you know you did it right.","Accept the silence","Remind them it was me"],[["The second shower worked on Tuesday. A small cheer went up in the corridor. Somebody stuck a sticker of a smiling sun on the door, and it stayed there for the rest of the year.",{happiness:3},{cl:5,rm:3,pop:3,note:"The long-dead second shower on one hostel floor was brought back to life.",tag:"funny"}],["The floor was clean, the queue moved, and the plug went in the bin without ceremony. It was a Monday. Nobody remembered.",{happiness:1},{cl:3,rm:1}],["I reminded them it was me. They said \u201Cthanks\u201D in a voice I didn\u2019t like. For a week I was known as the person who \u201Cdid the tiles\u201D, and it was not a compliment.",{happiness:-1},{cl:2,rm:-2,pop:-2}]]),Hn("lightsout","Lights-out monitor",["It was my week as lights-out monitor, which meant making sure the room was dark and quiet by ten. At five to, {a} was mid-story, {b} was on the phone to someone called \u201CMum\u201D, and {c} was eating crisps in a way you could hear from the next block.","Ask them to stop, nicely","Switch the lights off without warning"],["\u201CTwo minutes,\u201D {a} said, which in hostel language means twenty. The story got louder. It had a dragon in it. Somewhere near the end I realised I wanted to hear how it finished.","Let them finish","Be firm. It\u2019s lights out"],["The room went dark. There was a pause, then the sound of three people breathing very carefully at me. \u201CThat,\u201D {b} said, \u201Cwas a mistake.\u201D","Say sorry and turn it back on","Stand my ground"],["The dragon lost, which surprised everyone. After lights-out we lay in the dark for another hour, whispering about nothing: dinners, brothers, what we\u2019d do if we ran the school.","Join the talk","Remind them it\u2019s late"],["They obeyed, but in silence, like a hostage situation. The room was dark and cold in a way that wasn\u2019t only the temperature. I lay awake feeling like someone who had won the wrong argument.","Say something kind in the dark","Say nothing"],[["At midnight a warden\u2019s torch swept past the door and stopped. \u201CFour of you in there?\u201D We said nothing. The footsteps moved on. {c} whispered, \u201CLegend.\u201D I fell asleep tired and happy.",{happiness:4,mischief:2},{rm:4,note:"A hostel room stayed up after lights-out and got away with it.",tag:"funny"}],["Something I said in the dark made {b} laugh. It was a small, real laugh, the kind you only hear after lights-out. I slept better than I\u2019d expected.",{happiness:2},{rm:2}],["I said nothing. The next morning nobody spoke to me until breakfast, when {a} slid me a piece of toast without looking up. That was the peace treaty.",{happiness:-1},{rm:-2}]]));var vo=(t,e,a,r,o,n,i,l,d)=>({id:t,kind:"prefect",title:e,minAge:11,when:h=>{var c,u;return no((u=(c=h.social)==null?void 0:c.prefect)==null?void 0:u.role)===a},beats:{start:j(r[0],[s(r[1],"a"),s(r[2],"b")]),a:j(o[0],[s(o[1],"t1"),s(o[2],"t2")]),b:j(n[0],[s(n[1],"t1"),s(n[2],"t2")]),t1:j(i[0],[s(i[1],"e1"),s(i[2],"e2")]),t2:j(l[0],[s(l[1],"e2"),s(l[2],"e3")]),e1:N(d[0][0],0,d[0][1],d[0][2]),e2:N(d[1][0],0,d[1][1],d[1][2]),e3:N(d[2][0],0,d[2][1],d[2][2])}}),U1=(t,e,a,r,o)=>({id:t,kind:"interview",title:"The interview",minAge:11,beats:{start:j(e[0],[s(e[1],"q",0,{},{iv:1}),s(e[2],"q",0,{},{iv:2})]),q:j(a[0],a[1].map(([n,i])=>s(n,"r",0,{},{iv:i}))),r:j(r[0],r[1].map(([n,i])=>s(n,"close",0,{},{iv:i}))),close:N(o,0,{})}});ol.push(U1("interview-head",["The interview was in the headmaster\u2019s study, which smelled of coffee and old paper. Three people sat behind a desk. The one in the middle had my application open, and someone had written something in red in the margin.","Sit up straight and wait to be asked","Say good morning and ask how their day is going"],["\u201CWhy do you want to be {role}?\u201D the headmaster asked. It was a shorter question than the one I\u2019d prepared for.",[["\u201CBecause I think I can make this a better school.\u201D",3],["\u201CBecause I\u2019ve earned it.\u201D",1],["\u201CBecause my friends asked me to.\u201D",0]]],["The woman on the left leaned in. \u201CA younger pupil comes to you and says a prefect has been unfair to them. What do you do?\u201D",[["Listen first, then find out the facts",3],["Tell them to take it to a teacher",1],["Say prefects don\u2019t make mistakes",0]]],"I shook three hands and left. The door closed behind me with a very final click, and I stood in the corridor for a while pretending to read a noticeboard."),U1("interview-service",["The interview was in a classroom after hours. Two teachers sat at a desk pushed against a wall of children\u2019s drawings. One of them offered me a biscuit. I wasn\u2019t sure if it was a test.","Take the biscuit","Politely decline"],["\u201CWhat does a good {role} actually do?\u201D the first teacher asked, brushing crumbs off her notes.",[["\u201CMakes sure everyone feels they belong.\u201D",3],["\u201CEnforces the rules.\u201D",1],["\u201CDoes what teachers ask.\u201D",0]]],["The second teacher put down her pen. \u201CTell me about a time you helped someone who didn\u2019t ask.\u201D",[["Tell a true story, with details",3],["Say I can\u2019t think of one right now",1],["Make one up",0]]],"They thanked me and said I\u2019d hear within the week. I walked out feeling as though I\u2019d been in a very polite exam."),U1("interview-skills",["The interview was in the sports hall, which felt unfair. The coach sat on a bench with a clipboard, the head of department sat in a chair too small for him, and a netball hoop watched over us all.","Pick up a ball from the bench","Wait to be asked"],["\u201CWhy should we trust you with this?\u201D the coach said. \u201CNot your marks. You.\u201D",[["\u201CBecause I turn up, even when nobody\u2019s watching.\u201D",3],["\u201CBecause I want it.\u201D",2],["\u201CBecause I\u2019m good at it.\u201D",1]]],["The head of department tapped the table. \u201CYour team is losing and a younger pupil has made a mistake in front of everyone. What happens next?\u201D",[["Tell the team to back them up",3],["Take the pupil aside, privately",2],["Let the coach handle it",0]]],"The coach nodded once, wrote nothing, and said, \u201CWe\u2019ll let you know.\u201D That was either very good or very bad. I decided not to think about it until the weekend."),vo("assembly","Morning assembly","head",["The head handed me the microphone for the first time, on the stage of the main hall. Six hundred pupils, one speech, and a small boy in the front row giving me a thumbs-up for no reason.","Read the speech I wrote","Put the speech away and talk"],["It was a good speech. It had the word \u201Ctogether\u201D in it four times. Halfway through I realised nobody was listening, including the teachers, and the boy had stopped giving thumbs.","Add something real","Finish it as planned"],["I put the paper in my pocket and said the first true thing that came to mind, which was that the canteen chips had got worse. The hall woke up as one. A teacher laughed, then looked guilty.","Keep going on the chips","Pivot to the point"],["The head caught my eye from the side of the stage and raised one eyebrow, which could mean carry on or stop immediately. I\u2019d never been able to tell which.","Carry on","Wrap up"],["The hall was quiet, listening, and I had no idea what to say next. A hand went up near the back. \u201CIs it true there\u2019s going to be a new gym?\u201D","Answer honestly","Say I\u2019ll find out"],[["It went down as the best assembly of the term. The head stopped me in the corridor and said, \u201CYou have a gift. Please don\u2019t let it go to your head.\u201D It already had.",{happiness:4},{st:5,pop:4}],["It was fine. Nobody remembered it by lunch, which is the correct outcome of most assemblies.",{happiness:2},{st:2,pop:1}],["I said I\u2019d find out. I didn\u2019t, and everyone knew by Friday. The gym is still a rumour, and so, now, is my reliability.",{happiness:-2},{st:-3,pop:-1,note:"A head prefect promised an answer about a new gym in assembly and never gave one.",tag:"embarrassing"}]]),vo("cover","Chairing the meeting","deputy",["The head of the prefects was off sick, and the headmaster told me, in the corridor, in front of two first-years, that I would be chairing the meeting. \u201CNo pressure,\u201D he said, with a face that meant the opposite.","Prepare an agenda in ten minutes","Wing it and trust the room"],["The agenda had four items. The first was \u201Cthe state of the corridor\u201D. By item two we were arguing about whether noticeboards count as corridor. A prefect in the corner wrote \u201Cnoticeboards\u201D in her notes and drew a very small circle around it.","Stick to the agenda","Let the argument run"],["I opened with, \u201CRight.\u201D Eight prefects looked at me. Someone coughed. I realised I had no idea what we\u2019d been doing last week, and that nobody was going to rescue me.","Admit it honestly","Ask for last week\u2019s notes"],["The meeting was going somewhere, slowly, like a bus with a flat tyre. Then a prefect said the thing nobody had wanted to say: that two of us had been letting our friends off.","Address it openly","Move on to the next item"],["The room went silent. Someone dropped a pen. A decision was needed, and everyone was pretending it was someone else\u2019s.","Make the call","Put it to a vote"],[["We agreed on three rules and wrote them on the board. The head of the prefects came back and said, \u201CI heard the room was loud. That\u2019s the best sign.\u201D I didn\u2019t mention that it had been my idea.",{happiness:4},{st:5,pop:2}],["The meeting ended on time, which is the main achievement of most meetings. Nobody remembered anything except that it had ended.",{happiness:2},{st:2}],["We lost an hour on noticeboards. Afterwards three prefects told me, separately, that it had been \u201Cfine\u201D, in the tone people use for the opposite.",{happiness:-2},{st:-3,pop:-1,note:"A prefects\u2019 meeting spent an hour arguing about noticeboards.",tag:"funny"}]]),vo("register","Holding the class","class",["The teacher was late, so the class was mine. Thirty pupils, one whiteboard marker, and a boy at the back who had decided today was the day for a very specific kind of noise.","Take the register and ask for quiet","Write the lesson title on the board and wait"],["I took the register in my best teacher voice. It lasted three names. By \u201CDanjuma\u201D somebody was doing an impression of me, and it was good.","Laugh and take it in good part","Raise my voice"],["I wrote the title on the board. Silence fell, slowly, in rows. Two pupils actually started reading. I felt a small thrill of power, and then a bigger one of fear.","Keep control calmly","Hand out worksheets nobody asked for"],["The noise settled a little. A pupil near the front put her hand up. \u201CPlease, is it true you\u2019re allowed to give detentions?\u201D","Say yes, and explain when","Say that\u2019s the teacher\u2019s job, not mine"],["The door opened. The teacher stood there holding a coffee and wearing the expression of a person who has already guessed what happened.","Own up to what I did","Say it was fine"],[["The teacher listened to the whole story, said \u201Cthank you for holding the fort\u201D, and asked me to do it again next week. I did, with slightly less fear.",{happiness:4},{st:4,pop:2}],["\u201CGood,\u201D the teacher said, and began the lesson. Nobody mentioned the impression. I pretended not to know it had been me being imitated.",{happiness:2},{st:2,pop:1}],["The boy at the back told everyone I\u2019d shouted. By break it had become a legend, with sound effects. For a week I was \u201CSir\u201D in the corridors.",{happiness:-2},{st:-2,pop:-2,note:"A class prefect who raised their voice earned the nickname \u201CSir\u201D.",tag:"funny"}]]),vo("kit","Match-day kit","sports",["Saturday\u2019s match. The bus was late, the coach was furious, and we were two sets of kit short. Eleven players stood in the car park in a ring of uncertainty, like people at a bus stop for a bus that\u2019s been cancelled.","Sort the kit first","Calm the coach first"],["The kit was in a bag in the boot of a teacher\u2019s car. The teacher was in a meeting. I phoned the school office, who put me through to a voice that said, \u201CHold please.\u201D I held. A song played.","Keep holding","Go and find the teacher"],["The coach was pacing. \u201CEleven players and no bibs!\u201D she said, as if bibs were the whole point of sport. I said I\u2019d sort it. She looked at me long enough to make my knees go weak.","Promise to fix it in ten minutes","Ask her to help me think"],["At twenty to kick-off the kit arrived in the arms of a first-year, who had run the whole way across the field carrying it like a baby. He was bright red and smiling.","Thank him in front of the team","Take the kit and rush to the changing rooms"],["The other team arrived with their own supporters, a drum, and a boy dressed as a mascot. Ours had a coach, a first-year and eleven nervous people.","Give a short team talk","Let the coach speak"],[["We kicked off four minutes late and nobody on either side cared. The first-year got a clap at the final whistle. The coach said, \u201CThat\u2019s a good captain\u2019s instinct,\u201D and then, \u201Cnot that you\u2019re captain.\u201D",{toughness:2,happiness:4},{st:4,pop:3,note:"A first-year sprinted across the field with the missing kit before a school match.",tag:"sports"}],["It got sorted. The match was a draw, the bibs were the wrong colour, and nobody said a word about either. That\u2019s a good day for a sports prefect.",{toughness:1,happiness:2},{st:2}],["We started late and out of breath and lost 4\u20131. In the minibus home the coach said nothing for twenty minutes, which was worse than any lecture.",{happiness:-2},{st:-3,pop:-1,note:"A school team lost after a kit mix-up delayed kick-off.",tag:"sports"}]]),vo("overdue","Overdue","library",["The library had a problem: forty overdue books, one long-lost encyclopaedia, and a silence rule that had been quietly abandoned. The librarian handed me a list with the energy of someone passing on a curse.","Chase the overdue books","Restore the silence first"],["I went down the list. Half the books were in the same locker. Another had been \u201Clent to a cousin\u201D. A third had been dropped in a pond, and its owner described it with real feeling.","Go easy on them","Insist they pay for it"],["I stood at the library door and said, \u201CQuiet, please.\u201D Forty pupils looked at me. Then a boy at the back began, very slowly, to clap.","Smile and go along with it","Ask him to leave"],["Then the lab technician put her head round the door. Someone had left a Bunsen burner on in Room 3. It was still burning, calmly, next to a bag of paper.","Run and turn it off","Call a teacher"],["The librarian reappeared holding a very old book. \u201CThis was returned this morning,\u201D she said. \u201CIt\u2019s forty years late. The pupil who brought it is a grandmother.\u201D","Thank her for bringing it back","Ask the librarian to waive the fine"],[["The burner was off and the room was fine. The lab technician said, \u201CSharp reflexes,\u201D and then, quietly, \u201CPlease don\u2019t tell the head.\u201D I said I wouldn\u2019t. I\u2019m telling you.",{smarts:2,happiness:4},{st:4,pop:2,note:"A prefect switched off a lab Bunsen burner left on beside a pile of paper.",tag:"achievement"}],["The books came back in a slow trickle, and the encyclopaedia turned up on a shelf in Geography, filed under \u201CWeather\u201D. The librarian said, \u201CTypical.\u201D",{smarts:1,happiness:2},{st:2}],["The silence rule fell apart again by Thursday. The librarian said, \u201CI\u2019m not angry, I\u2019m just disappointed,\u201D which is a thing librarians can do to a person.",{happiness:-2},{st:-3,pop:-1}]]),vo("queue","The lunch queue","dining",["Lunch queue duty. The queue reached the car park. At the front, a boy with an allergy card was arguing with a server, and at the back a first-year stood alone with a tray, looking at nothing.","Help the boy with the allergy card","Go to the first-year"],["The server said the soup had \u201Cprobably\u201D no nuts. The boy said probably wasn\u2019t good enough, and a long, tense silence went through the dining hall like a draught.","Check with the kitchen","Tell him to pick something safer"],["The first-year said they were fine. Then they said they weren\u2019t. They\u2019d been eating alone for three weeks and had decided that the best response was to be invisible.","Sit with them","Introduce them to someone else"],["The cook, a woman who could turn a lunch queue to stone with a look, wiped her hands and said, \u201CI\u2019ve cooked here for twenty years. I know what\u2019s in my soup.\u201D","Ask her to show the label","Thank her and move on"],["The first-year told me their dog was called Biscuit. I hadn\u2019t expected a name. Something shifted. They sat up an inch straighter.","Ask about Biscuit","Change the subject to the food"],[["She showed the label. There were nuts. Nobody had been hurt, but it was close enough that the head wrote a note on the fridge door: CHECK. The boy shook my hand without a word.",{happiness:4},{st:5,pop:3,note:"A dining prefect caught a nut warning on the lunch soup before anyone was hurt.",tag:"achievement"}],["The queue moved, the soup got labelled, and the first-year ate lunch with two other people. Nobody noticed. That\u2019s how it\u2019s meant to go.",{happiness:2},{st:3,pop:1}],["I moved on and the moment passed. The boy ate a cold sandwich in silence. The first-year ate alone again the next day. I wrote both facts on my hand to fix later.",{happiness:-2},{st:-2}]]),vo("latenight","After midnight","dorm",["It was gone midnight when I heard it: someone crying, very quietly, behind a door three rooms down. Further along the corridor a torch beam moved under another door, followed by laughter.","Go to the crying first","Go to the torch first"],["It was a first-year, sitting on his bed holding a letter from home. He\u2019d tried to be silent. He looked up at me with the face of a person caught doing something private.","Sit down beside him","Fetch a warden"],["The torch belonged to three boys playing cards under a duvet, with a packet of biscuits and the kind of expression that says \u201Cwe have rehearsed this\u201D.","Confiscate the torch","Join in, quietly"],["He told me his gran was ill and nobody had said how ill. The letter had one line crossed out in black pen. I read it, because he asked me to.","Stay and listen","Tell him it\u2019ll be fine"],["A warden\u2019s footsteps sounded in the corridor, slow and even, the footsteps of someone who has stopped being surprised.","Take the blame for the card game","Hide in the toilets"],[["I stayed until he fell asleep. In the morning he left a biscuit on my bed with a note: \u201CThank you for not telling anyone.\u201D I haven\u2019t.",{happiness:5},{st:5,pop:2}],["I told him it would be fine, because it was all I had. He nodded. I don\u2019t think either of us believed it, but it helped.",{happiness:2},{st:3}],["The warden found us. The card game ended in confiscation and a lecture. The next morning the three boys wouldn\u2019t look at me, and the first-year had been moved to another dorm.",{happiness:-3},{st:-4,pop:-2,note:"A dorm prefect was caught up in a midnight card game.",tag:"embarrassing"}]]),{id:"thelist",kind:"prefect",title:"After the announcement",minAge:11,priority:!0,when:t=>{var r,o,n,i;let e=(o=(r=t.social)==null?void 0:r.prefect)==null?void 0:o.history,a=e==null?void 0:e[e.length-1];return!((i=(n=t.social)==null?void 0:n.prefect)!=null&&i.role)&&!!a&&a.result==="lost"&&a.age===t.age},beats:{start:j("The list went up on the noticeboard at break. I read it standing, then read it again in case my name had been hiding. It hadn\
